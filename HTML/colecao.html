<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coleção – Closet da Jack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

<header>
  <div class="bar">
    <a href="index.html#inicio" class="logo ouro">Closet da Jack</a>
    <nav>
      <a href="index.html#inicio">Início</a>
      <a href="colecao.html">Coleção</a>
      <a href="feminino.html">Feminino</a>
      <a href="masculino.html">Masculino</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
    <a class="cart" href="sacola.html" aria-label="Ver sacola">Sacola (<span id="qtd">0</span>)</a>
  </div>
</header>

<main>
  <section>
    <h1 class="titulo-pagina">Coleção</h1>
    <p class="sub">Escolha uma categoria e adicione suas peças à sacola.</p>
    <div class="filtros" id="filtros">
      <button data-cat="todos" aria-pressed="true">Todos</button>
      <button data-cat="feminino" aria-pressed="false">Feminino</button>
      <button data-cat="masculino" aria-pressed="false">Masculino</button>
    </div>
    <div class="toolbar-listagem" aria-label="Buscar e ordenar produtos">
      <label class="campo-pesquisa" for="buscaProduto">
        <span>Buscar</span>
        <input id="buscaProduto" type="search" placeholder="Buscar peça..." autocomplete="off">
      </label>
      <label class="campo-select" for="filtroPreco">
        <span>Preço</span>
        <select id="filtroPreco">
          <option value="todas">Todos os preços</option>
          <option value="ate-150">Até R$ 150</option>
          <option value="150-250">R$ 150 a R$ 250</option>
          <option value="acima-250">Acima de R$ 250</option>
        </select>
      </label>
      <label class="campo-select" for="ordemProdutos">
        <span>Ordenar</span>
        <select id="ordemProdutos">
          <option value="relevancia">Mais relevantes</option>
          <option value="menor-preco">Menor preço</option>
          <option value="maior-preco">Maior preço</option>
          <option value="alfabetica">A-Z</option>
        </select>
      </label>
    </div>
    <div class="grade" id="grade"></div>
  </section>
</main>

<footer>© 2026 Closet da Jack. Todos os direitos reservados.</footer>
<button class="voltar-inicio" id="btnVoltar" type="button">← Voltar</button>
<div id="aviso" role="status"></div>
<script src="../JAVASCRIPT/produtos.js"></script>
<script src="../JAVASCRIPT/script.js"></script>
</body>
</html>
